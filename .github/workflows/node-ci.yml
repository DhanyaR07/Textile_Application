name: Textile Application Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-application:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code from Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Sandbox Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Verify Backend Dependancies
      run: |
        cd server
        npm install